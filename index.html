<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9E7E1">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Cutline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23111'/%3E%3Crect x='10' y='13' width='44' height='7' fill='%23FF7D00'/%3E%3Crect x='10' y='28' width='44' height='7' fill='%23E9E7E1'/%3E%3Crect x='10' y='43' width='28' height='7' fill='%23E9E7E1'/%3E%3C/svg%3E">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   CUTLINE v3 · FIELD-GRADE
   One operator, one hand, direct sun. Forest system in OKLCH, light-dark()
   throughout; Archivo Black carries the numbers, Barlow Condensed carries
   the labels, mono carries the money. The field timer is the signature —
   everything else stays quiet around it.
   Sections: tokens → base → chrome → components(legacy vocabulary) →
   screens → field surface → booking → palette/dialog/toast → a11y/motion.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ─── tokens ─── */
:root{
  color-scheme:light dark;
  /* surfaces */
  --bg:      light-dark(oklch(96.6% .012 106), oklch(15.8% .018 162));
  --bg2:     light-dark(oklch(93.8% .014 108), oklch(13.4% .016 162));
  --srf:     light-dark(oklch(99.2% .005 102), oklch(20.6% .02 160));
  --srf2:    light-dark(oklch(97.6% .01 104),  oklch(23.4% .022 158));
  /* ink — AAA on --bg and --srf */
  --ink:     light-dark(oklch(20% .035 158),   oklch(96% .012 120));
  --ink2:    light-dark(oklch(33% .04 155),    oklch(85% .02 135));
  --mut:     light-dark(oklch(44% .035 152),   oklch(74% .025 140));
  --line:    light-dark(oklch(88% .014 120),   oklch(30% .02 158));
  --line2:   light-dark(oklch(92.5% .012 115), oklch(25.5% .02 158));
  /* brand */
  --pine:    light-dark(oklch(30% .06 156),    oklch(88% .03 130));
  --pine-ink:light-dark(oklch(97% .01 110),    oklch(18% .03 160));
  --leaf:    light-dark(oklch(52% .11 152),    oklch(74% .13 150));
  --leaf-soft:light-dark(oklch(93% .04 150),   oklch(30% .05 152));
  --leaf-deep:light-dark(oklch(38% .09 153),   oklch(84% .11 148));
  /* earned contrast — timer + destructive only */
  --org:     light-dark(oklch(65% .185 44),    oklch(71% .17 46));
  --org-ink: oklch(17% .04 60);
  --org-soft:light-dark(oklch(94% .05 55),     oklch(32% .07 50));
  /* semantics */
  --gold:    light-dark(oklch(50% .11 80),     oklch(80% .13 85));
  --gold-soft:light-dark(oklch(94% .05 85),    oklch(30% .05 82));
  --rain:    light-dark(oklch(46% .09 245),    oklch(74% .09 235));
  --rain-soft:light-dark(oklch(93% .03 240),   oklch(28% .045 245));
  --risk:    light-dark(oklch(50% .17 27),     oklch(72% .16 25));
  /* derived states */
  --press: color-mix(in oklch, var(--ink) 8%, transparent);
  --focus: var(--leaf);
  /* elevation — three tiers, no soup */
  --e1: 0 1px 0 color-mix(in oklch, var(--ink) 9%, transparent);
  --e2: 0 1px 2px color-mix(in oklch, var(--ink) 10%, transparent), 0 4px 14px color-mix(in oklch, var(--ink) 7%, transparent);
  --e3: 0 8px 20px color-mix(in oklch, var(--ink) 16%, transparent), 0 22px 60px color-mix(in oklch, var(--ink) 18%, transparent);
  /* shape & rhythm */
  --r1:10px; --r2:14px; --r3:20px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px; --s7:42px;
  /* type */
  --disp:'Archivo',system-ui,sans-serif;
  --cond:'Barlow Condensed','Archivo',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --fs-0:clamp(.78rem,.74rem + .2vw,.84rem);
  --fs-1:clamp(.9rem,.86rem + .25vw,.98rem);
  --fs-2:clamp(1rem,.95rem + .3vw,1.08rem);
  --fs-3:clamp(1.3rem,1.2rem + .6vw,1.5rem);
  --fs-4:clamp(1.9rem,1.6rem + 1.6vw,2.5rem);
  --fs-5:clamp(2.6rem,2rem + 3vw,3.6rem);
  /* motion */
  --fast:.14s; --med:.26s; --slow:.42s;
  --snap:cubic-bezier(.2,.9,.25,1); --mech:cubic-bezier(.5,0,.15,1);
  --nav-h:74px;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}

/* ─── base ─── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--disp); font-variation-settings:'wdth' 96,'wght' 460;
  font-size:var(--fs-2); line-height:1.5; text-wrap:pretty;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  min-height:100dvh;
}
body.hasbar{padding-bottom:calc(var(--nav-h) + 60px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;line-height:1.12;letter-spacing:-.015em}
h2{font-variation-settings:'wdth' 78,'wght' 850;font-size:var(--fs-3)}
h3{font-variation-settings:'wdth' 80,'wght' 820;font-size:var(--fs-3)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;border-radius:var(--r1)}
input,select,textarea{
  font:inherit;color:var(--ink);background:var(--srf);
  border:1.5px solid var(--line);border-radius:var(--r1);
  padding:13px 14px;width:100%;min-height:48px;
  &:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in oklch,var(--leaf) 28%,transparent)}
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--mut) 50%),linear-gradient(-45deg,transparent 49%,var(--mut) 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
::selection{background:color-mix(in oklch,var(--leaf) 30%,transparent)}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--s4)}
.lbl{font-family:var(--cond);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:var(--fs-0);color:var(--mut)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums;font-weight:600}

/* ─── chrome: masthead ─── */
header{position:sticky;top:0;z-index:14;background:color-mix(in oklch,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}
.mast{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:var(--s3);
  padding:calc(var(--s3) + env(safe-area-inset-top)) var(--s4) var(--s3)}
.mast .id{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.mast .bars{display:grid;gap:3.5px;width:26px}
.mast .bars i{height:5px;border-radius:2px;background:var(--pine)}
.mast .bars i:nth-child(1){width:26px;background:var(--leaf)}
.mast .bars i:nth-child(2){width:19px}
.mast .bars i:nth-child(3){width:23px}
.mast .tx{min-width:0}
.mast .tx b{display:block;font-variation-settings:'wdth' 74,'wght' 900;font-size:1.14rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast .tx span{display:block;font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:1px}
.mast .wx{flex:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 13px;border-radius:99px;
  background:var(--rain-soft);color:var(--rain);font-family:var(--mono);font-weight:600;font-size:.82rem;text-decoration:none;
  &:active{transform:scale(.96)}
  & svg{width:12px;height:12px}
  & .go{opacity:.7}
}
.mast .pal{flex:none;width:44px;height:44px;border-radius:12px;background:var(--srf);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--mut);
  &:active{background:var(--press)}
  & svg{width:19px;height:19px}
}

/* ─── chrome: bottom nav ─── */
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in oklch,var(--srf) 92%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:var(--nav-h);color:var(--mut);border-radius:0;
  font-family:var(--cond);font-weight:600;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;
  transition:color var(--fast)}
nav#tabs button svg{width:23px;height:23px}
nav#tabs button.on{color:var(--leaf-deep)}
nav#tabs button.on::after{content:'';position:absolute;top:0;left:22%;right:22%;height:3.5px;border-radius:0 0 4px 4px;background:var(--leaf)}
nav#tabs .pip{position:absolute;top:12px;right:calc(50% - 21px);width:9px;height:9px;border-radius:99px;background:var(--org);border:2px solid var(--srf)}

/* ─── chrome: run strip (job live, field collapsed) ─── */
#runbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:19;
  background:var(--org);color:var(--org-ink);
  transform:translateY(calc(100% + var(--nav-h) + env(safe-area-inset-bottom) + 8px));
  visibility:hidden;pointer-events:none;
  transition:transform var(--med) var(--snap),visibility 0s var(--med)}
#runbar.on{transform:none;visibility:visible;pointer-events:auto;transition:transform var(--med) var(--snap)}
#runbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:var(--s3);min-height:60px;padding:0 var(--s4);cursor:pointer}
#runbar .pulse{width:11px;height:11px;border-radius:99px;background:var(--org-ink);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
#runbar .who{flex:1;min-width:0;font-variation-settings:'wdth' 76,'wght' 850;text-transform:uppercase;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#runbar .t{font-family:var(--mono);font-weight:700;font-size:1.3rem;font-variant-numeric:tabular-nums}
#runbar .go{font-size:1.1rem}

/* ─── legacy component vocabulary, re-skinned (sheet + books builders) ─── */
.panel{background:var(--srf);border:1px solid var(--line2);border-radius:var(--r2);box-shadow:var(--e1);container-type:inline-size}
.panel.pad{padding:var(--s4)}
section{margin-bottom:var(--s6)}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin:0 2px var(--s3)}
.hd .lnk{font-family:var(--cond);font-weight:700;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--leaf-deep);min-height:44px;display:flex;align-items:center;padding:0 4px;
  border-bottom:2.5px solid var(--leaf)}
.rows{display:flex;flex-direction:column}
.blk{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;padding:13px 6px;
  border-bottom:1px solid var(--line2);
  &:last-child{border-bottom:0}
  &:active{background:var(--press)}
}
.blk .core{flex:1;min-width:0}
.blk .nm{display:block;font-variation-settings:'wdth' 84,'wght' 720;font-size:var(--fs-2)}
.blk .sub{display:block;color:var(--mut);font-size:var(--fs-1);margin-top:1px}
.blk .chev{color:var(--mut);font-size:1.1rem}
.sub{color:var(--mut)}
.eb{font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kv{display:flex;justify-content:space-between;gap:var(--s3);align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line2)}
.kv:first-child{padding-top:0}.kv:last-child{border-bottom:0;padding-bottom:0}
.kv .k{color:var(--ink2)}
.kv .v{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:7px;padding:4px 9px;background:var(--line2);color:var(--ink2)}
.tag.hot{background:var(--org-soft);color:light-dark(oklch(45% .16 45),oklch(85% .12 55))}
.tag.ghost{background:transparent;border:1.5px solid var(--line);color:var(--mut)}
.tag.owe{background:var(--gold-soft);color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 16px;
  border-radius:var(--r1);border:1.5px solid var(--line);background:var(--srf);
  font-variation-settings:'wdth' 84,'wght' 700;font-size:var(--fs-1);
  transition:transform var(--fast),background var(--fast);
  &:active{transform:scale(.975);background:var(--press)}
  &[disabled]{opacity:.45;pointer-events:none}
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.risk{background:transparent;border-color:color-mix(in oklch,var(--risk) 55%,var(--line));color:var(--risk)}
.btn.slab{width:100%;min-height:58px;font-size:var(--fs-2);letter-spacing:.01em}
.btn.sm{min-height:48px;padding:10px 13px;font-size:var(--fs-0)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s2)}
.f{display:block;margin-bottom:var(--s3)}
.f .stencil{display:block;margin-bottom:6px}
.stencil{font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;
  border:1.5px solid var(--line);border-radius:10px;background:var(--srf);
  font-family:var(--cond);font-weight:600;font-size:.92rem;letter-spacing:.03em;
  &.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
  &:active{transform:scale(.96)}
}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.hint{color:var(--mut);font-size:var(--fs-1)}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--mut)}
.empty .mk{display:flex;gap:6px;justify-content:center;margin-bottom:var(--s3)}
.empty .mk i{width:22px;height:8px;border-radius:3px;background:var(--line)}
.empty .mk i:first-child{background:var(--leaf);width:30px}
.empty b{display:block;color:var(--ink);font-variation-settings:'wdth' 80,'wght' 800;font-size:var(--fs-3);margin-bottom:6px}
.empty .hint{max-width:34ch;margin:0 auto}
.meter{height:12px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:var(--s2)}
.meter i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width var(--slow) var(--mech)}
.meter i.warn{background:var(--gold)}
.meter i.bad{background:var(--risk)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.stat{background:var(--srf);border:1px solid var(--line2);border-radius:var(--r2);padding:var(--s3) var(--s4);box-shadow:var(--e1)}
.stat .fig{font-variation-settings:'wdth' 72,'wght' 900;font-size:var(--fs-4);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .cap{font-family:var(--cond);font-weight:600;font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.bars8{display:flex;align-items:flex-end;gap:7px;height:100px;padding:var(--s3) 2px 0}
.bars8 .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars8 .b i{width:100%;border-radius:6px 6px 2px 2px;background:var(--line);min-height:3px}
.bars8 .b.now i{background:var(--leaf)}
.barlbl{font-family:var(--cond);font-weight:600;font-size:.66rem;letter-spacing:.05em;color:var(--mut);text-transform:uppercase}
.rt{width:100%;border-collapse:collapse;
  & .l{text-align:left;padding:10px 2px;border-bottom:1px solid var(--line2)}
  & .m,& .s{text-align:right;padding:10px 2px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
  & tr:last-child td{border-bottom:0}
  & th{font-family:var(--cond);font-weight:600;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:right;padding:0 2px 8px}
  & th:first-child{text-align:left}
}
.banner{display:flex;align-items:center;gap:var(--s3);width:100%;background:var(--leaf-soft);
  border:1px solid color-mix(in oklch,var(--leaf) 35%,var(--line));border-radius:var(--r2);
  padding:13px var(--s4);min-height:56px;margin-bottom:var(--s4)}
.banner b{font-variation-settings:'wdth' 82,'wght' 780}
.banner .chev{margin-left:auto;color:var(--leaf-deep)}

/* ─── sheet (native dialog) ─── */
dialog#sheet{
  position:fixed;inset:auto 0 0 0;width:100%;max-width:100%;border:0;margin:0;padding:0;
  background:var(--srf);color:var(--ink);border-radius:var(--r3) var(--r3) 0 0;box-shadow:var(--e3);
  max-height:88dvh;
  transition:transform var(--med) var(--snap),opacity var(--med),overlay var(--med) allow-discrete,display var(--med) allow-discrete;
}
dialog#sheet[open]{transform:none;opacity:1}
@starting-style{dialog#sheet[open]{transform:translateY(60px);opacity:0}}
dialog#sheet:not([open]){transform:translateY(60px);opacity:0}
dialog#sheet::backdrop{background:color-mix(in oklch,oklch(12% .02 160) 45%,transparent);backdrop-filter:blur(2px)}
.sc{overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:88dvh;
  padding:var(--s4) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.sc::before{content:'';display:block;width:44px;height:4.5px;border-radius:99px;background:var(--line);margin:0 auto var(--s4)}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.sh .sub{margin-top:2px}
.sh .x{flex:none;width:48px;height:48px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--ink2)}

/* ─── toast ─── */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));translate:-50% 0;z-index:60;
  display:flex;align-items:center;gap:var(--s3);
  background:var(--pine);color:var(--pine-ink);border-radius:12px;padding:13px 17px;box-shadow:var(--e2);
  font-variation-settings:'wdth' 86,'wght' 650;font-size:var(--fs-1);max-width:min(92vw,440px);
  opacity:0;pointer-events:none;transition:opacity var(--fast),translate var(--med) var(--snap),bottom var(--med) var(--snap)}
body.hasbar #toast{bottom:calc(var(--nav-h) + 78px + env(safe-area-inset-bottom))}
#toast.show{opacity:1;pointer-events:auto;translate:-50% -6px}
#toast .undo{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:light-dark(oklch(90% .1 130),oklch(35% .07 152));border-bottom:2px solid currentColor;padding:2px 0;min-height:auto}

/* ─── screens ─── */
#view{padding-top:var(--s2)}
.screen-in{animation:vin var(--med) var(--snap)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Today — the route is a sequence and reads as one */
.hero{background:var(--pine);color:var(--pine-ink);border-radius:var(--r3);padding:var(--s5) var(--s5) var(--s4);
  box-shadow:var(--e2);position:relative;overflow:hidden;margin-bottom:var(--s4)}
:root[data-theme=dark] .hero,.hero{container-type:inline-size}
.hero::after{content:'';position:absolute;inset:0 0 0 62%;
  background:repeating-linear-gradient(-55deg,transparent 0 14px,color-mix(in oklch,var(--pine-ink) 7%,transparent) 14px 28px)}
.hero .cap{font-family:var(--cond);font-weight:600;font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;opacity:.75}
.hero .big{font-variation-settings:'wdth' 72,'wght' 900;font-size:var(--fs-5);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}

<script>
'use strict';
/* storage shim: real localStorage when allowed, in-memory fallback when sandboxed */
const LS=(()=>{try{const t='__cutline_probe';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}
catch(e){const m={};return{getItem:k=>Object.prototype.hasOwnProperty.call(m,k)?m[k]:null,
setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];},clear:()=>{for(const k of Object.keys(m))delete m[k];},
key:i=>Object.keys(m)[i]??null,get length(){return Object.keys(m).length;}};}})();

/* ============================================================
   Cutline v2 — the whole loop in one file: their booking page at #book,
   your route, week, lawns and books. LS. Zero paid APIs.
   ============================================================ */

/* ---------- tiny utils ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round((+n||0)*100)/100).toLocaleString('en-CA',{minimumFractionDigits:(+n%1?2:0),maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dow=s=>parseISO(s).getDay();
const niceDate=s=>{const d=parseISO(s),t=todayISO();if(s===t)return'Today';if(s===addDays(t,1))return'Tomorrow';if(s===addDays(t,-1))return'Yesterday';return DOWS[d.getDay()]+' '+d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});};
const fmtMin=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const numval=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent);

/* ---------- store ---------- */
const DB_KEY='cutline.v1';
const FRESH=()=>({
  settings:{biz:'Cutline',me:'',et:'',homeAddr:'North Bay, ON',lat:46.3091,lng:-79.4608,target:70,defPrice:50,maps:'apple'},
  clients:[],jobs:[],ledger:[],requests:[],fuel:[],legs:[],
  equip:{hours:0,bladeAt:0,bladeInt:25,oilAt:0,oilInt:50},
  meta:{genThrough:'',wx:null,lastExport:null,created:todayISO(),geo:null,geoAt:null,lastStop:null}
});
/* geo fields carried by anything that owns a position — every client, and the
   one-time jobs that keep their own coordinates. lat/lng are older than this and
   stay where they are. Existing records get the same shape from backfillRecords(). */
const GEO0=()=>({posSrc:null,posAcc:null,posAt:null});
const AER0=()=>({aerated:null,aerOk:null});
let db;
try{db=Object.assign(FRESH(),JSON.parse(LS.getItem(DB_KEY)||'{}'));}
catch(e){db=FRESH();}
db.settings=Object.assign(FRESH().settings,db.settings||{});
db.equip=Object.assign(FRESH().equip,db.equip||{});
db.meta=Object.assign(FRESH().meta,db.meta||{});
let saveT=null;
function flushDB(){
  clearTimeout(saveT);saveT=null;
  try{LS.setItem(DB_KEY,JSON.stringify(db));}
  catch(e){toast('Storage full — export a backup');}
  queuePush();
}
/* save() coalesces; save(true) writes now. Anything that could be followed by the
   phone going straight into a pocket must write now, not in 150ms. */
const save=now=>{if(now===true)return flushDB();clearTimeout(saveT);saveT=setTimeout(flushDB,150);};
addEventListener('pagehide',flushDB);
addEventListener('beforeunload',flushDB);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDB();});

/* ══════════════ PLATFORM — offline-first server sync ══════════════
   No server configured → pure solo mode, identical to the single file.
   Served over http(s) (or pointed at a server) → the phone stays the
   working copy; the server is the meeting point: doc sync + rolling
   snapshots + a booking inbox that catches requests while the app
   is closed. Every call is fire-safe; the field never waits on it. */
const IS_SERVED=/^https?:$/.test(location.protocol);
let TOK=LS.getItem('cutline.tok')||'';
let REV=+(LS.getItem('cutline.rev')||0);
const SYNC={st:'off',at:+(LS.getItem('cutline.at')||0)};
const srvBase=()=>IS_SERVED?'':(LS.getItem('cutline.srv')||'');
const canSync=()=>(!!srvBase()||(IS_SERVED&&TOK!==''))&&typeof fetch==='function';
if(canSync())SYNC.st='idle';
function setTok(v){TOK=(v||'').trim();LS.setItem('cutline.tok',TOK);}
function setSrv(v){LS.setItem('cutline.srv',(v||'').trim().replace(/\/+$/,''));SYNC.st=canSync()?'idle':'off';}
async function api(path,opt={}){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(srvBase()+'/api/'+path,{...opt,signal:ctl.signal,
      headers:{'Content-Type':'application/json',...(TOK?{'Authorization':'Bearer '+TOK}:{}),...(opt.headers||{})}});
    if(r.status===401){SYNC.st='auth';paintSync();throw new Error('auth');}
    if(!r.ok)throw new Error('http '+r.status);
    return await r.json();
  }finally{clearTimeout(t);}
}
let pushT=null,PUSHING=false;
function queuePush(){if(!canSync())return;clearTimeout(pushT);pushT=setTimeout(pushDoc,1200);}
async function pushDoc(){
  if(!canSync()||PUSHING)return;PUSHING=true;
  if(SYNC.st!=='auth'){SYNC.st='sync';paintSync();}
  try{
    const r=await api('doc',{method:'PUT',body:JSON.stringify({doc:db})});
    REV=r.rev;LS.setItem('cutline.rev',REV);

/* ---------- geocode (Nominatim, free, cached per client) ---------- */
async function geocode(addr){
  if(!addr)return null;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(addr));
    const j=await r.json();
    if(j&&j[0])return{lat:+j[0].lat,lng:+j[0].lon};
  }catch(e){}
  return null;
}
const havKm=(a,b)=>{
  if(!a||!b||a.lat==null||b.lat==null)return 1e9;
  const R=6371,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
};

const isoWeek=s=>{const d=parseISO(s);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return iso(d);};
function occursOn(c,dateISO){
  if(!c.active||c.cad==='none')return false;
  if(dow(dateISO)!==c.day)return false;
  if((c.paused||[]).some(p=>dateISO>=p.f&&dateISO<=p.t))return false;
  if(c.cad==='weekly')return true;
  if(c.cad==='biweekly'){const dd=diffDays(c.anchor,dateISO);return dd%14===0;}
  return false;
}
function ensureJobs(){
  const t=todayISO(),horizon=addDays(t,13);
  let from=db.meta.genThrough&&db.meta.genThrough>=t?addDays(db.meta.genThrough,1):t;
  if(from>horizon){return;}
  for(let d=from;d<=horizon;d=addDays(d,1)){
    for(const c of db.clients){
      if(!occursOn(c,d))continue;
      const exists=db.jobs.some(j=>j.cid===c.id&&j.typ==='route'&&Math.abs(diffDays(j.date,d))<=3);
      if(exists)continue;
      db.jobs.push({id:uid(),cid:c.id,date:d,ord:1e6,st:'sched',typ:'route',price:c.price,min:0,notes:''});
    }
  }
  db.meta.genThrough=horizon;
  normalizeOrders();save();
}

function normalizeOrders(){
  const byDate={};
  db.jobs.forEach(j=>{(byDate[j.date]??=[]).push(j);});
  Object.values(byDate).forEach(list=>list.sort((a,b)=>a.ord-b.ord).forEach((j,i)=>j.ord=i+1));
}

function optimize(d){
  const list=jobsOn(d).filter(j=>j.st==='sched');
  const withPos=list.filter(j=>jobPos(j).lat!=null),noPos=list.filter(j=>jobPos(j).lat==null);
  let cur={lat:db.settings.lat,lng:db.settings.lng};const out=[];
  const pool=[...withPos];
  while(pool.length){
    pool.sort((a,b)=>havKm(cur,jobPos(a))-havKm(cur,jobPos(b)));
    const n=pool.shift();out.push(n);cur=jobPos(n);
  }
  const done=jobsOn(d).filter(j=>j.st!=='sched');
  [...done,...out,...noPos].forEach((j,i)=>j.ord=i+1);

  toast(noPos.length?`Route set (${noPos.length} without a map pin left last)`:'Route optimized');
}

  const to=addDays(d,1);
  const base=Math.max(0,...jobsOn(to).map(j=>j.ord));

/* ══════════════ CAPTURE ══════════════
   The phone already knows where it is when the timer starts and what time it
   is when it stops. That's enough to learn both where every lawn is and what
   the hop between two of them really costs, without geocoding a rural address
   or paying for a routing API. Nothing here is allowed to block the timer,
   throw, or put a dialog in front of him in the field. */
const FIX_TIMEOUT=15000;   /* iOS is slow and loose on the first fix after a cold start */
const FIX_MAX_AGE=60000;   /* an older fix belongs to a different driveway */
const FIX_MAX_ACC=50;      /* metres. A 2km-wide fix puts the pin in the lake */
const FIX_BETTER=0.7;      /* a replacement fix has to be clearly tighter, not a hair */
const LEG_MIN_SEC=30;      /* under this he never actually left the property */
const LEG_MAX_SEC=90*60;   /* over this he went home, ate dinner, or took a call */

/* One rule for every pin the app writes, wherever it came from. A manual
   placement is a deliberate human decision and nothing overwrites it. A
   measured fix beats a geocoded guess. Two measured fixes only trade places
   when the newer one is clearly tighter than the one on file. */
const POSRANK={manual:3,gps:2,geo:1};
const posRank=s=>POSRANK[s]||0;
function writePos(rec,lat,lng,src,acc){
  if(!rec||lat==null||lng==null)return false;
  if(rec.lat!=null&&rec.lng!=null){
    const from=posRank(rec.posSrc),to=posRank(src);
    if(to<from)return false;
    /* same rank: a fresh geocode means the address changed and a fresh manual
       placement means he moved the pin himself — both intentional, both go
       through. Two GPS fixes are the only case that has to argue on accuracy. */
    if(to===from&&src==='gps'&&!(acc!=null&&(rec.posAcc==null||acc<=rec.posAcc*FIX_BETTER)))return false;
  }
  rec.lat=lat;rec.lng=lng;rec.posSrc=src;
  rec.posAcc=acc==null?null:Math.round(acc);
  rec.posAt=Date.now();
  return true;
}

/* Resolves to a fix or to null. Never rejects, never throws, and never waits
   longer than it promised — some browsers accept the call and then say nothing
   at all, so there's a hard backstop under the platform timeout. */
function getFix(){
  return new Promise(res=>{
    let done=false;
    const finish=v=>{if(done)return;done=true;res(v);};
    if(!navigator.geolocation)return finish(null);
    setTimeout(()=>finish(null),FIX_TIMEOUT+2000);
    try{
      navigator.geolocation.getCurrentPosition(
        p=>{noteGeo('ok');
          finish({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()});},
        e=>{noteGeo(e&&e.code===1?'denied':e&&e.code===2?'unavailable':'timeout');finish(null);},
        {enableHighAccuracy:true,timeout:FIX_TIMEOUT,maximumAge:FIX_MAX_AGE});
    }catch(e){noteGeo('unavailable');finish(null);}
  });
}
/* Remembered so Settings can say so once, quietly. We still call on the next
   timer start rather than locking ourselves out: a denied browser errors
   straight back without prompting, so this never nags — and it means turning
   permission back on starts working again without hunting for a reset. */
function noteGeo(st){
  if(db.meta.geo===st)return;
  db.meta.geo=st;db.meta.geoAt=Date.now();save();
}

/* Timer start. Fired after the timer is already running — a fix that never
   arrives costs nothing but a pin. */
function captureStart(id){
  const j0=job(id),t0=j0&&j0.t0;
  if(!t0)return;
  getFix().then(f=>{
    const j=job(id);
    if(!f||!j||j.t0!==t0)return;   /* abandoned or restarted while we waited */
    j.p0={lat:f.lat,lng:f.lng,acc:Math.round(f.acc),at:f.at};
    /* the pin is the property's, not the cut's — a one-time cut is its own property */
    if(f.acc<=FIX_MAX_ACC)writePos(j.cid?client(j.cid):j,f.lat,f.lng,'gps',f.acc);
    save();
    if(TAB==='today'&&!FIELDON)render();
  }).catch(()=>{});
}
/* Timer stop. The position is recorded for the audit trail; the leg is decided
   from the clock alone, so it doesn't wait on a fix that may never come. */
function captureStop(id){
  const j0=job(id),t1=j0&&j0.t1;
  if(!t1)return;
  getFix().then(f=>{
    const j=job(id);
    if(!f||!j||j.t1!==t1)return;
    j.p1={lat:f.lat,lng:f.lng,acc:Math.round(f.acc),at:f.at};
    if(f.acc<=FIX_MAX_ACC)writePos(j.cid?client(j.cid):j,f.lat,f.lng,'gps',f.acc);
    save();
    if(TAB==='today'&&!FIELDON)render();
  }).catch(()=>{});
}

/* A stop is keyed by the property it happened at. One-time cuts have no client
   record, so they key off the id the ledger already groups them by. */
function stopKey(j){return j.cid||('o:'+(j.oid||j.id));}
function posOfKey(k){
  if(!k)return null;
  if(String(k).indexOf('o:')===0){
    const j=db.jobs.find(x=>x.cid==null&&('o:'+(x.oid||x.id))===k);
    return j&&j.lat!=null&&j.lng!=null?{lat:j.lat,lng:j.lng}:null;
  }
  const c=client(k);
  return c&&c.lat!=null&&c.lng!=null?{lat:c.lat,lng:c.lng}:null;
}
/* Raw observations only, one row per hop, never aggregated on write — the
   median algorithm will change and this history has to survive it. Note that
   this is the time between stops, not drive time: it includes opening the gate
   and unloading the trailer, which is the real cost of the stop. */
function recordLeg(j){
  const here=stopKey(j),prev=db.meta.lastStop;
  if(prev&&prev.key&&prev.key!==here&&j.t0){
    const sec=Math.round((j.t0-prev.at)/1000);
    if(sec>=LEG_MIN_SEC&&sec<=LEG_MAX_SEC){
      const a=posOfKey(prev.key),b=posOfKey(here);
      /* coordinates live on the row as well as the keys, so a later change of
         algorithm can re-read the raw observation without a lookup */
      if(a&&b)db.legs.push({id:uid(),from:prev.key,to:here,sec,ts:Date.now(),fromPos:a,toPos:b});
    }
    /* outside the window it goes in the bin without a word */
  }
  db.meta.lastStop={key:here,at:j.t1||Date.now()};
}

/* how much of the notebook is filled */
function mapped(){

/* ---------- job flow ---------- */
let tickT=null;
function startJob(id){
  const act=db.jobs.find(j=>j.st==='active');
  if(act&&act.id!==id){toast(`Finish ${jobName(act)} first`);return openJob(act.id);}
  const j=job(id);j.st='active';j.t0=Date.now();save(true);closeSheet();render();openField();
  /* last, and unawaited — the timer is already running and stays running
     whether or not a fix ever turns up. Starting a cut is also a user gesture,
     which is what iOS wants before it will raise the permission prompt. */
  captureStart(id);
}
function finishJob(id){
  const j=job(id);
  const min=Math.max(1,Math.round((Date.now()-j.t0)/60000));
  j.st='done';j.t1=Date.now();j.min=min;delete j.carried;
  db.equip.hours=Math.round((db.equip.hours+min/60)*100)/100;
  const c=client(j.cid);
  if(!j.charged){
    j.charged=true;
    const amt=+j.price||0;
    if(amt>0){
      const r2=v=>Math.round(v*100)/100;
      const credit=c?(c.prepay||0):0;
      const used=r2(Math.min(credit,amt));
      if(used>0){
        c.prepay=r2(credit-used);
        db.ledger.push({id:uid(),cid:j.cid,jid:j.id,date:todayISO(),amt:used,st:'paid',paid:todayISO(),meth:'prepay',typ:'cut'});
      }
      const rem=r2(amt-used);
      if(rem>0)db.ledger.push({id:uid(),cid:j.cid,jid:j.id,oid:j.oid||null,date:todayISO(),amt:rem,st:'due',typ:'cut',who:jobName(j),ph:jobPhone(j)});
    }
  }
  recordLeg(j);
  save(true);afterFinish(id,min);
  captureStop(id);
}
function pushJob(id,days){const j=job(id);j.date=addDays(j.date,days);j.ord=1e6;delete j.carried;normalizeOrders();save();closeSheet();render();toast(`Moved to ${niceDate(j.date)}`);}
function skipJob(id){const j=job(id);j.st='skip';save();closeSheet();render();toast('Skipped');}
function delJob(id){
  const j=db.jobs.find(x=>x.id===id);
  const led=db.ledger.filter(l=>l.jid===id&&l.st==='due');
  db.ledger=db.ledger.filter(l=>!(l.jid===id&&l.st==='due'));
  db.jobs=db.jobs.filter(x=>x.id!==id);
  save();closeSheet();render();
  toast('Removed '+(j?jobName(j):'cut'),'Undo',()=>{if(j)db.jobs.push(j);led.forEach(x=>db.ledger.push(x));save();render();});
}

function due(){return db.ledger.filter(l=>l.st==='due');}
function clientDue(cid){return due().filter(l=>l.cid===cid).reduce((s,l)=>s+l.amt,0);}

  db.ledger.push({id:uid(),cid,date:todayISO(),amt,st:'paid',paid:todayISO(),meth,typ:'topup'});save();}
function clientStats(c){

  const timed=done.filter(j=>j.min);
  const avg=timed.length?timed.reduce((s,j)=>s+j.min,0)/timed.length:0;
  const rate=avg?(c.price/(avg/60)):0;
  return{cuts:done.length,avg:Math.round(avg),rate:Math.round(rate)};
}
function seasonStats(){
  const paid=db.ledger.filter(l=>l.st==='paid'&&l.meth!=='prepay');
  const collected=paid.reduce((s,l)=>s+l.amt,0);
  const owing=due().reduce((s,l)=>s+l.amt,0);
  const done=db.jobs.filter(j=>j.st==='done');
  const mins=done.reduce((s,j)=>s+(j.min||0),0);
  const cutRev=db.ledger.filter(l=>l.typ==='cut').reduce((s,l)=>s+l.amt,0);
  const rate=mins?Math.round(cutRev/(mins/60)):0;
  const costs=db.fuel.reduce((s,f)=>s+f.cost,0);
  const fuel=db.fuel.filter(f=>!f.cat||f.cat==='Fuel').reduce((s,f)=>s+f.cost,0);
  const cpc=done.length?Math.round(fuel/done.length*100)/100:0;
  return{collected,owing,cuts:done.length,mins,rate,fuel,costs,cpc};
}

/* ---------- intake: magic link + paste ---------- */
function decodePayload(str){
  try{
    const tok=(str.match(/CUT1\.([A-Za-z0-9_-]+)/)||[])[1];if(!tok)return null;
    const b=tok.replace(/-/g,'+').replace(/_/g,'/');
    const json=decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))));
    const o=JSON.parse(json);
    if(!o.n)return null;
    return{name:String(o.n).slice(0,60),phone:String(o.p||'').slice(0,20),addr:String(o.a||'').slice(0,120),
      svc:['weekly','biweekly','once'].includes(o.s)?o.s:'once',day:String(o.d||'').slice(0,12),notes:String(o.x||'').slice(0,300)};
  }catch(e){return null;}
}
function checkIntake(){
  const h=location.hash+location.search;
  if(!/CUT1\./.test(h))return;
  const p=decodePayload(h);
  history.replaceState(null,'',location.pathname);
  if(p)openIntake(p);
}
async function pasteBooking(){
  try{
    const txt=await navigator.clipboard.readText();
    const p=decodePayload(txt);
    if(p)openIntake(p);else toast('No booking code found in clipboard');
  }catch(e){toast('Tap allow, or long-press the text and copy first');}
}
function saveRequest(p){db.requests.push({id:uid(),...p,ts:Date.now(),st:'new'});save();render();}
function acceptOnce(p,dateISO,price,reqId){
  const jid=uid();
  db.jobs.push({id:jid,cid:null,oid:uid(),name:p.name,phone:p.phone,addr:p.addr,lat:null,lng:null,...GEO0(),
    date:dateISO,ord:1e6,st:'sched',typ:'od',price:+price||db.settings.defPrice,min:0,notes:p.notes||''});
  normalizeOrders();
  if(reqId){const _r=db.requests.find(r=>r.id===reqId);if(_r&&_r.sid)ackBooking(_r.sid,'accepted');db.requests=db.requests.filter(r=>r.id!==reqId);}
  save();closeSheet();render();toast(`Added ${p.name} — ${niceDate(dateISO)}`);
  geocode(p.addr).then(g=>{const j=job(jid);if(g&&j&&writePos(j,g.lat,g.lng,'geo',null))save();});
}
function nextDow(day){let d=todayISO();for(let i=0;i<8;i++){if(dow(d)===day&&d>=todayISO())return d;d=addDays(d,1);}return todayISO();}
function acceptRecurring(p,cad,day,price,reqId){
  const anchor=nextDow(day);
  const c={id:uid(),name:p.name,phone:p.phone,addr:p.addr,lat:null,lng:null,...GEO0(),...AER0(),cad,day,anchor,
    price:+price||db.settings.defPrice,prepay:0,gate:'',dog:false,notes:p.notes||'',active:true,paused:[],created:todayISO()};
  db.clients.push(c);
  if(reqId){const _r=db.requests.find(r=>r.id===reqId);if(_r&&_r.sid)ackBooking(_r.sid,'accepted');db.requests=db.requests.filter(r=>r.id!==reqId);}
  db.meta.genThrough='';ensureJobs();save();closeSheet();render();
  toast(`${p.name} added — first cut ${niceDate(anchor)}`);
  geocode(p.addr).then(g=>{if(g&&writePos(c,g.lat,g.lng,'geo',null))save();});
}
function declineReq(r){
  if(r.sid)ackBooking(r.sid,'declined');
  if(r.phone)location.href=smsUrl(r.phone,TPL.decline(r.name));
  db.requests=db.requests.filter(x=>x.id!==r.id);save();closeSheet();render();
}

/* ---------- backup ---------- */
function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`cutline-backup-${todayISO()}.json`;
  a.click();URL.revokeObjectURL(a.href);
  db.meta.lastExport=todayISO();save();render();
}
$('#importfile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    if(!j.settings||!Array.isArray(j.clients))throw 0;
    db=Object.assign(FRESH(),j);db.settings=Object.assign(FRESH().settings,db.settings||{});db.equip=Object.assign(FRESH().equip,db.equip||{});db.meta=Object.assign(FRESH().meta,db.meta||{});db.meta.genThrough='';backfillRecords();ensureJobs();rollOverdue();save();render();toast('Backup restored');
  }catch(err){toast('That file is not a Cutline backup');}};
  r.readAsText(f);e.target.value='';
});
function backupStale(){
  const n=db.jobs.filter(j=>j.st==='done').length;
  if(n<10)return false;
  if(!db.meta.lastExport)return true;
  return diffDays(db.meta.lastExport,todayISO())>7;
}

  const t=todayISO(),list=jobsOn(t);

  const leftMin=list.filter(j=>j.st!=='done').reduce((s,j)=>s+estMin(j),0);
  const w=wxFor(t),wet=w&&w.pop>=RAIN_POP;
  const collected=list.filter(j=>j.st==='done').reduce((s,j)=>s+(+j.price||0),0);
  const prog=list.length?Math.round(done/list.length*100):0;
  let h='';
  if(db.requests.length)h+=`<button class="banner" onclick="openRequests()"><b>${db.requests.length===1?'A new request is waiting':db.requests.length+' requests waiting'}</b><span class="chev">›</span></button>`;

  if(list.some(j=>j.st==='sched'))h+=`<div class="actions2">
    <button class="btn" onclick="optimize('${t}')">Order route</button>
    <button class="btn"${wet?' style="border-color:var(--rain);color:var(--rain)"':''} onclick="askShift('${t}')">${wet?`Rain ${w.pop}% — push`:'Push day'}</button></div>`;
  if(!list.length){
    h+=`<div class="empty"><div class="mk"><i></i><i></i><i></i></div><b>Route is clear</b>
      <div class="hint">Nothing booked today. Add a cut below, or check the week.</div></div>`;
    if(!db.clients.length&&!db.meta.sample)h+=`<button class="btn slab" onclick="loadSample()">Load a sample day</button><div style="height:var(--s2)"></div>`;
  }else{
    h+=`<div class="route" style="--route-done:${prog}%">`+list.map((j,i)=>{
      const c=client(j.cid);
      const live=j.st==='active';
      let tg='';
      if(j.carried)tg+='<span class="tag hot">carried over</span>';
      if(c&&c.gate)tg+=`<span class="tag ghost">gate ${esc(c.gate)}</span>`;
      if(c&&c.dog)tg+='<span class="tag ghost">dog</span>';
      const d=j.cid?clientDue(j.cid):0;
      if(d>0)tg+=`<span class="tag owe">owes ${money(d)}</span>`;
      return `<button class="stopcard ${j.st==='done'?'done':''} ${live?'live':''}" onclick="openJob('${j.id}')">

    }).join('')+'</div>';

    h+=`<div class="hint" style="text-align:center;margin:var(--s3) 0 var(--s2)">${mp.n} of ${mp.of} mapped</div>`;

function askShift(d){
  const n=jobsOn(d).filter(j=>j.st==='sched').length;

  const w=wxFor(d);
  openSheet(`<div class="sh"><div>${w&&w.pop>=RAIN_POP?`<div class="eb">${w.pop}% rain forecast</div>`:''}

    <button class="btn pri slab" onclick="closeSheet();cascade('${d}')">Move ${n} forward</button>
    <button class="btn" onclick="closeSheet()">Leave it</button>`);
}

  let cuts=0,val=0;

  let h=`<div class="stats" style="margin-bottom:var(--s4)">
    <div class="stat"><div class="fig">${cuts}</div><div class="cap">Cuts, next 7 days</div></div>
    <div class="stat"><div class="fig">${money(val)}</div><div class="cap">On the books</div></div></div>`;
  for(let i=0;i<7;i++){
    const d=addDays(t,i),l=jobsOn(d),w=wxFor(d);
    const wet=w&&w.pop>=RAIN_POP;
    const mins=l.filter(j=>j.st!=='done').reduce((a,j)=>a+estMin(j),0);
    const sum=l.reduce((a,j)=>a+(+j.price||0),0);
    h+=`<div class="day">
      <div class="dayhead">
        <span class="dt">${i===0?'Today':i===1?'Tomorrow':parseISO(d).toLocaleDateString('en-CA',{weekday:'long'})}<small>${parseISO(d).toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</small></span>
        ${wet?`<span class="tag hot">◔ ${w.pop}%</span>`:w?`<span class="tag ghost">${w.pop}% · ${w.t}°</span>`:''}
        <span class="tl">${l.length?`${l.length} · ${fmtMin(mins||0)} · ${money(sum)}`:''}</span>
      </div>
      <div class="daybody">${
        l.length?`<div class="rows">${l.map(j=>`
          <button class="blk" onclick="openJob('${j.id}')">
            <span class="core"><span class="nm">${j.st==='done'?'✓ ':''}${esc(jobName(j))}${j.carried?' <span class="tag hot">carried over</span>':''}</span>
            <span class="sub">${esc(jobAddr(j))||''}</span></span>

        <button class="btn sm" style="margin:var(--s2) 0 var(--s3)" onclick="openQuickAdd('${d}')">＋ Add</button>
      </div></div>`;
  }
  return h;
}

      <button class="btn sm risk" onclick="delJob('${j.id}')">Remove</button></div>`);

async function saveClient(id){

    cad:$('#c-cad .on')?.dataset.v||'weekly',day:+($('#c-day .on')?.dataset.v??1),

    dog:$('#c-dog').classList.contains('on'),notes:$('#c-notes').value.trim()};
  let c=id?client(id):null;
  const addrNew=!c||c.addr!==v.addr,cadNew=!c||c.cad!==v.cad||c.day!==v.day;
  if(!c){c={id:uid(),lat:null,lng:null,...GEO0(),...AER0(),prepay:0,active:true,paused:[],created:todayISO(),anchor:nextDow(v.day)};db.clients.push(c);}

const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>{const b=s.replace(/-/g,'+').replace(/_/g,'/');return decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))));};
const encodeBooking=o=>'CUT1.'+b64e(JSON.stringify(o));
function bookLink(){
  if(IS_SERVED&&TOK)return location.origin+'/book';
  return location.href.split('#')[0]+'#book='+b64e(JSON.stringify({b:db.settings.biz,p:db.settings.me}));
}

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('Link copied — send it anywhere'),()=>prompt('Copy your booking link:',u));
  else prompt('Copy your booking link:',u);
}

  try{const o=JSON.parse(b64d(m[1]));return{b:String(o.b||'Cutline').slice(0,40),p:String(o.p||'').slice(0,20)};}
  catch(e){return{b:db.settings.biz,p:db.settings.me,preview:true};}
}

    db.ledger.push(paid?{id:uid(),cid:c.id,jid:j.id,date,amt:c.price,st:'paid',paid:date,meth:meth||'e-Transfer',typ:'cut'}
                       :{id:uid(),cid:c.id,jid:j.id,date,amt:c.price,st:'due',typ:'cut',who:c.name,ph:c.phone});
    return j;};
  dj(c1,7,38,true);dj(c1,14,41,true);dj(c2,14,52,true);dj(c4,6,47,true);dj(c3,5,33,false);
  const od={id:uid(),cid:null,oid:uid(),name:'Corner lot on Marshall',phone:'',addr:'64 Marshall Ave, North Bay',lat:null,lng:null,...GEO0(),
    date:addDays(t,-3),ord:1,st:'done',typ:'od',price:65,min:44,notes:''};
  db.jobs.push(od);
  db.ledger.push({id:uid(),cid:null,jid:od.id,oid:od.oid,date:od.date,amt:65,st:'paid',paid:od.date,meth:'Cash',typ:'cut',who:od.name});
  db.fuel.push({id:uid(),date:addDays(t,-10),cost:41.20,l:18,cat:'Fuel'},{id:uid(),date:addDays(t,-4),cost:12.99,l:0,cat:'Gear'});
  db.equip.hours=4.3;
  db.meta.sample=true;db.meta.genThrough='';
  ensureJobs();rollOverdue();save(true);render();
  toast('Sample day loaded — erase it any time in Books');

/* ══════════════ SCHEMA STAMP + MIGRATIONS ══════════════
   Forward-only, additive, idempotent. Nothing is ever renamed or removed.

   v3 read the v2 schema unchanged (cutline.v1) and froze a copy of the v2
   payload under cutline.v2.backup. v4 adds the geo capture fields. The stamp
   is now compared as a number rather than merely probed, so the next
   migration after this one can actually run — the old presence check would
   have skipped it on every phone that already carried a stamp. */
const SCHEMA=4;
const schemaAt=()=>+(LS.getItem('cutline_schema_version')||0);
let MIGGATE=false;

/* Additive field backfill. Only writes keys that are missing, so a second run
   changes nothing. Called by the migration, and again any time the whole doc
   is replaced from elsewhere — a server pull, a restored backup file — since
   those can arrive shaped for an older schema. */
function backfillRecords(){
  let n=0;
  for(const c of db.clients){
    /* lat/lng predate this and are already populated by address geocoding.
       Those pins are the least trustworthy source in the book, so they are
       marked 'geo' and stay open to correction by any GPS fix that clears the
       accuracy gate. 'manual' is the one source capture must never overwrite. */
    if(!('posSrc'in c)){c.posSrc=(c.lat!=null&&c.lng!=null)?'geo':null;n++;}
    if(!('posAcc'in c)){c.posAcc=null;n++;}
    if(!('posAt'in c)){c.posAt=null;n++;}
    if(!('aerated'in c)){c.aerated=null;n++;}
    if(!('aerOk'in c)){c.aerOk=null;n++;}
  }
  for(const j of db.jobs){
    if(!('p0'in j)){j.p0=null;n++;}   /* position at timer start, mirrors t0 */
    if(!('p1'in j)){j.p1=null;n++;}   /* position at timer stop,  mirrors t1 */
    /* one-time cuts own their coordinates, so they own their provenance too */
    if(j.cid==null&&!('posSrc'in j)){Object.assign(j,GEO0());j.posSrc=(j.lat!=null&&j.lng!=null)?'geo':null;n++;}
  }
  if(!Array.isArray(db.legs)){db.legs=[];n++;}
  return n;
}

/* what the book weighs, so we can watch it over a season */
function stateBytes(){
  let doc=0,all=0;
  const size=s=>{try{return new Blob([s]).size;}catch(e){return String(s).length;}};
  try{doc=size(JSON.stringify(db));}catch(e){}
  try{for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.indexOf('cutline')===0)all+=k.length+size(LS.getItem(k)||'');}}catch(e){}
  return{doc,all};
}
function logStateSize(tag){
  const b=stateBytes(),kb=n=>(n/1024).toFixed(1)+' KB';
  console.log(`Cutline ${tag} · schema v${schemaAt()} · doc ${kb(b.doc)} · cutline.* storage ${kb(b.all)} · `+
    `${db.clients.length} lawns, ${db.jobs.length} cuts, ${db.ledger.length} ledger rows, ${db.legs.length} legs`);
  return b;
}

/* The migration proper. Snapshot first, mutate second, stamp last. If any of
   it throws, the prior payload goes back exactly as it was and the stamp is
   left alone, so the next boot tries again rather than running on half-built
   state. */
function migrateTo4(){
  const before=LS.getItem(DB_KEY);
  try{
    if(before&&LS.getItem('cutline.v3.backup')==null)LS.setItem('cutline.v3.backup',before);
    backfillRecords();
    LS.setItem(DB_KEY,JSON.stringify(db));
    LS.setItem('cutline_schema_version',String(SCHEMA));
    logStateSize('migrated to v'+SCHEMA);
    return true;
  }catch(e){
    console.error('Cutline migration failed — nothing was changed',e);
    /* memory first: rebuilding db from the snapshot always works, while the
       disk write is the thing most likely to have thrown in the first place.
       Doing it the other way round leaves half-backfilled records in memory. */
    if(before!=null){
      try{
        db=Object.assign(FRESH(),JSON.parse(before));
        db.settings=Object.assign(FRESH().settings,db.settings||{});
        db.equip=Object.assign(FRESH().equip,db.equip||{});
        db.meta=Object.assign(FRESH().meta,db.meta||{});
      }catch(_){}
      try{LS.setItem(DB_KEY,before);}catch(_){}
    }
    migFailed(e);
    return false;
  }
}

/* Boot gate. Nothing on file yet means nothing to lose — migrate quietly.
   With a real book on the phone, §4 wants a file in his hands first, so the
   sheet blocks until he has one. */
function runSchemaGate(){
  /* preserve v3's frozen pre-v3 copy for anyone arriving without a stamp */
  try{if(!LS.getItem('cutline_schema_version')){const raw=LS.getItem(DB_KEY);if(raw)LS.setItem('cutline.v2.backup',raw);}}catch(e){}
  if(schemaAt()>=SCHEMA){logStateSize('boot');return false;}
  if(!db.clients.length&&!db.jobs.length&&!db.ledger.length){migrateTo4();return false;}
  MIGGATE=true;
  openSheet(`<div class="sh"><div><div class="eb">One time only</div><h3>Save a copy first</h3>
    <div class="sub">This update gives every lawn a place to keep its map pin. Nothing is removed and nothing is renamed — but put the whole book somewhere other than this phone before it runs.</div></div></div>
    <div class="panel pad">
      <div class="kv"><span class="k">Lawns</span><b class="v">${db.clients.length}</b></div>
      <div class="kv"><span class="k">Cuts on file</span><b class="v">${db.jobs.length}</b></div>
      <div class="kv"><span class="k">Ledger rows</span><b class="v">${db.ledger.length}</b></div></div>
    <button class="btn pri slab" id="mig-export" onclick="migExport()">Export a backup</button>
    <button class="btn slab" id="mig-go" style="margin-top:var(--s2)" disabled onclick="migGo()">I have the file — carry on</button>
    <div class="hint" style="margin-top:var(--s3)">A copy stays in the phone's storage either way, but that copy goes wherever the phone goes.</div>`);
  return true;
}
function migExport(){
  exportBackup();
  const g=$('#mig-go');if(g)g.disabled=false;
  const e=$('#mig-export');if(e)e.textContent='Export it again';
  toast(`Saved cutline-backup-${todayISO()}.json`);
}
function migGo(){
  MIGGATE=false;closeSheet();
  if(migrateTo4()){render();checkIntake();}
}
function migFailed(e){
  MIGGATE=false;closeSheet();
  setTimeout(()=>{
    MIGGATE=true;
    openSheet(`<div class="sh"><div><div class="eb">Nothing was changed</div><h3>The update didn't finish</h3>
      <div class="sub">Your lawns, cuts and money are exactly as they were, and the app works normally. It will try again next time you open it. If it keeps failing, send that backup file on.</div></div></div>
      <div class="panel pad"><div class="kv"><span class="k">What went wrong</span><span class="v" style="max-width:62%;font-family:var(--mono);font-size:var(--fs-0)">${esc(String((e&&e.message)||e||'unknown'))}</span></div></div>
      <button class="btn slab" onclick="MIGGATE=false;closeSheet();">Keep working</button>`);
  },40);
}

/* ══════════════ BOOT ══════════════ */
function countUp(){
  const el=$('#heroamt');if(!el||countUp.done)return;
  const to=+el.dataset.to;if(!to)return;countUp.done=true;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const t0=performance.now();
  const step=n=>{const k=Math.min(1,(n-t0)/560),e=1-Math.pow(1-k,3);
    el.textContent=money(Math.round(to*e));if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function render(){
  $('#m-biz').textContent=db.settings.biz.toUpperCase();
  $('#m-date').textContent=new Date().toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'});
  const w=wxFor(todayISO()),el=$('#m-wx');
  if(w){el.style.display='flex';el.className='wx'+(w.pop>=RAIN_POP?' wet':'');
    el.innerHTML=`${DROP}<span class="num">${w.pop}% · ${w.t}°</span><span class="go">›</span>`;}
  renderTabs();
  $('#view').innerHTML=({today:vToday,week:vWeek,lawns:vLawns,money:vMoney,shop:vShop}[TAB]||vToday)();
  if(TAB==='today')countUp();
  syncRun();
}
const clockOf=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600);return h?`${h}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`:`${Math.floor(s/60)}:${pad(s%60)}`;};
setInterval(()=>{document.querySelectorAll('.tick').forEach(el=>{
  const t0=+el.dataset.t0;if(t0)el.textContent=clockOf(Date.now()-t0);});},1000);
let LASTDAY=todayISO();
setInterval(()=>{if(todayISO()!==LASTDAY){LASTDAY=todayISO();openDay=todayISO();ensureJobs();rollOverdue();loadWeather();render();}},60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ensureJobs();rollOverdue();loadWeather().then(render);if(!BK||BK.preview){pullDoc().then(()=>fetchBookings());}}});
ensureJobs();rollOverdue();render();
const _bk=readBookParam();
if(_bk)enterBooking(_bk);
else if(IS_SERVED&&location.pathname.replace(/\/+$/,'')==='/book')enterCustomer();
/* the gate never shows on the customer's booking page — only on his own app.
   When it does show, intake waits until he's through it. */

if(IS_SERVED&&'serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.addEventListener('hashchange',()=>{const b=readBookParam();if(b)enterBooking(b);else checkIntake();});
/* console bridge — debugging + test rig access to closure-scoped state */
window.CUT={get db(){return db},set db(v){db=v},money,numval,clockOf,addDays,todayISO,diffDays,fmtMin,iso,parseISO,isoWeek,b64d,encodeBooking,esc,uid,job,client,save,FRESH,
  pushDoc,pullDoc,fetchBookings,ackBooking,syncNow,setTok,setSrv,get SYNC(){return SYNC},get REV(){return REV},get TOK(){return TOK},
  SCHEMA,schemaAt,backfillRecords,migrateTo4,runSchemaGate,stateBytes,logStateSize,GEO0,AER0,get MIGGATE(){return MIGGATE},
  startJob,finishJob,abortTimer,render,
  writePos,getFix,captureStart,captureStop,recordLeg,stopKey,posOfKey,mapped,
  FIX_TIMEOUT,FIX_MAX_AGE,FIX_MAX_ACC,FIX_BETTER,LEG_MIN_SEC,LEG_MAX_SEC};
